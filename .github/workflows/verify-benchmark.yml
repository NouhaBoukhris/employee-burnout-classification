name: Verify burnout benchmark outputs
on:
  push:
    paths:
      - 'src/burnout_classification.py'
      - 'data/tech_mental_health_burnout.csv'
      - 'results/model_comparison.csv'
      - 'requirements.txt'
      - '.github/workflows/verify-benchmark.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Save committed benchmark metrics for comparison
        run: cp results/model_comparison.csv /tmp/expected-model-comparison.csv
      - name: Recompute benchmark
        run: python src/burnout_classification.py
      - name: Save first recomputation
        run: cp results/model_comparison.csv /tmp/first-model-comparison.csv
      - name: Verify repeatability in the same environment
        run: |
          python src/burnout_classification.py
          python - <<'PY'
          import pandas as pd
          from pandas.testing import assert_frame_equal
          a = pd.read_csv('/tmp/first-model-comparison.csv').sort_values('model').reset_index(drop=True)
          b = pd.read_csv('results/model_comparison.csv').sort_values('model').reset_index(drop=True)
          assert_frame_equal(a, b, check_exact=False, rtol=1e-6, atol=1e-8)
          print('Two consecutive benchmark runs match.')
          PY
      - name: Compare recomputed and committed metrics
        run: |
          python - <<'PY'
          import pandas as pd
          from pandas.testing import assert_frame_equal
          a = pd.read_csv('/tmp/expected-model-comparison.csv').sort_values('model').reset_index(drop=True)
          b = pd.read_csv('results/model_comparison.csv').sort_values('model').reset_index(drop=True)
          # Allow up to 0.002 absolute score drift across library versions.
          # This is 0.2 percentage points for accuracy/recall/precision.
          assert_frame_equal(a, b, check_exact=False, rtol=0, atol=0.002)
          print('Saved benchmark metrics match within the documented 0.002 tolerance.')
          PY

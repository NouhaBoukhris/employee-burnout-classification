<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 535" role="img" aria-labelledby="title desc"><title id="title">Model accuracy versus high burnout recall</title><desc id="desc">Accuracy is highest for Random Forest at 92.41 percent, while High-class recall is zero. Logistic Regression has 76.92 percent High recall with 88.15 percent accuracy. Based on the revised benchmark CSV.</desc><rect width="1040" height="535" fill="#ffffff"/><text x="42" y="50" font-size="27" font-family="Arial,sans-serif" font-weight="700" fill="#14283f">Accuracy vs. high-burnout recall</text><text x="42" y="79" font-size="15" font-family="Arial,sans-serif" fill="#56677a">Revised benchmark · stratified 80/20 split · 13 High cases in test set</text><text x="250" y="122" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#1c496f">Overall accuracy</text><text x="670" y="122" font-size="17" font-family="Arial,sans-serif" font-weight="700" fill="#1b786c">High-class recall</text><text x="42" y="173" font-size="15" font-family="Arial,sans-serif" fill="#22354c">Baseline</text><rect x="250" y="154" width="300" height="25" rx="4" fill="#edf1f5"/><rect x="250" y="154" width="263.3" height="25" rx="4" fill="#427fb3"/><text x="558" y="173" font-size="14" font-family="Arial,sans-serif" fill="#22354c">87.75%</text><rect x="670" y="154" width="280" height="25" rx="4" fill="#edf1f5"/><text x="960" y="173" font-size="14" font-family="Arial,sans-serif" fill="#22354c">0.00%</text><text x="42" y="227" font-size="15" font-family="Arial,sans-serif" fill="#22354c">Logistic Regression</text><rect x="250" y="208" width="300" height="25" rx="4" fill="#edf1f5"/><rect x="250" y="208" width="264.5" height="25" rx="4" fill="#427fb3"/><text x="558" y="227" font-size="14" font-family="Arial,sans-serif" fill="#22354c">88.15%</text><rect x="670" y="208" width="280" height="25" rx="4" fill="#edf1f5"/><rect x="670" y="208" width="215.4" height="25" rx="4" fill="#31a694"/><text x="960" y="227" font-siz